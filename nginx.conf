upstream peakmovies_api {
  server api:3000;
}

upstream peakmovies_player {
  server player:3001;
}

upstream peakmovies_admin {
  server admin:3002;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 4m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  # API, including the signed /api/v1/proxy stream relay.
  location /api/ {
    proxy_pass http://peakmovies_api;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Admin dashboard. Next.js runs with basePath=/admin, so keep the prefix.
  location /admin {
    proxy_pass http://peakmovies_admin;
    proxy_read_timeout 60s;
  }

  # Pretty iframe URLs: /player/movie/27205 -> Next route /movie/27205.
  location /player/ {
    rewrite ^/player/(.*)$ /$1 break;
    proxy_pass http://peakmovies_player;
    proxy_read_timeout 60s;
  }

  # Player assets and root routes.
  location / {
    proxy_pass http://peakmovies_player;
    proxy_read_timeout 60s;
  }
}
